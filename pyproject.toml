[project]
name = "jobscout"
version = "0.7.0"
description = "Assistente local de candidaturas: captura vagas, rascunhos para aprovar e linha do tempo."
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.1",
  "python-docx>=1.1",
  "pywebview>=5; sys_platform == 'win32'",
]

[project.scripts]
jobscout = "jobscout.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobscout*"]

[tool.setuptools.package-data]
jobscout = ["web/index.html", "web/app.css", "web/app.js"]
